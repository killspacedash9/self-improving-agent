name: Self-Improve

# The agent loop:
#   - manually:  Actions → Self-Improve → Run workflow → type a task
#   - via chat:  the chat window files an issue labeled "agent-request";
#                the `labeled` event fires and the agent picks it up,
#                then comments its result back on the issue.

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: What should the agent do?
        required: true
        type: string
      mode:
        description: How should the agent publish its change?
        required: false
        default: push
        type: choice
        options:
          - push
          - pr
          - local
      max_rounds:
        description: Repair attempts per run
        required: false
        default: 3
        type: number
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: self-improve
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent-request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r harness/requirements.txt

      - name: Run the agent
        if: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || 'deepseek-chat' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" == "issues" ]; then
            python harness/runner.py --issue "${{ github.event.issue.number }}" \
              --source "issue #${{ github.event.issue.number }}" \
              --mode "${{ inputs.mode || 'push' }}" \
              --branch "${{ github.ref_name }}" \
              --max-rounds "${{ inputs.max_rounds || 3 }}"
          else
            python harness/runner.py --task "${{ inputs.prompt }}" \
              --source "manual dispatch" \
              --mode "${{ inputs.mode || 'push' }}" \
              --branch "${{ github.ref_name }}" \
              --max-rounds "${{ inputs.max_rounds || 3 }}"
          fi

      - name: Stand-down notice (API key not configured)
        if: ${{ secrets.DEEPSEEK_API_KEY == '' }}
        run: |
          echo "::warning title=Agent stood down::DEEPSEEK_API_KEY is not configured."
          echo "Add the secret at Settings → Secrets and variables → Actions →"
          echo "DEEPSEEK_API_KEY, then re-run this workflow."
